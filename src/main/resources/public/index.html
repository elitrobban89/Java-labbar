<!DOCTYPE html>
<!-- Java-labbar — (c) 2026 Robert Andersson Kopler. Alla rattigheter forbehallna. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java-labbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --gron: #014932;
    --gron2: #395144;
    --persika: #FFEFEA;
    --term: #0f1a15;
    --termtext: #d6f5e3;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; }
  body { font-family: "Hind", system-ui, sans-serif; padding: 4px 16px 16px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .intro { font-size: 1.05rem; line-height: 1.55; margin: 0 0 14px; color: #333; }

  .val { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 14px; }
  .kort {
    font: inherit; text-align: left; cursor: pointer; background: #fff; color: #000;
    border: 2px solid var(--gron); border-radius: 12px; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 2px; transition: background .15s, color .15s;
  }
  .kort:hover { background: var(--persika); }
  .kort:focus-visible { outline: 3px solid var(--gron2); outline-offset: 2px; }
  .kort[aria-pressed="true"] { background: var(--gron); color: #fff; }
  .kort b { font-size: 1.1rem; line-height: 1.3; }
  .kort span { font-size: .9rem; opacity: .85; line-height: 1.35; }

  .term { position: relative; background: var(--term); border-radius: 12px; overflow: hidden; box-shadow: 0 6px 24px rgba(1,73,50,.18); }
  .topp {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1c2b24; color: #9fc4b0;
    font: 12px/1.4 var(--mono);
  }
  .topp i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; flex: none; }
  .topp i + i { background: #febc2e; }
  .topp i + i + i { background: #28c840; }
  .topp em { font-style: normal; margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ut {
    height: min(470px, 62vh); overflow-y: auto; padding: 12px 14px; color: var(--termtext);
    font: 14px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; cursor: text;
  }
  .ut .err { color: #ff9b8a; }
  .ut .eko { color: #fff; }
  .ut .info { color: #8fb8a3; font-style: italic; }
  .markor { color: #fff; }
  .markor::after {
    content: ""; display: inline-block; width: .6em; height: 1.1em; margin-left: 1px; vertical-align: text-bottom;
    background: #7bdcb5; animation: blink 1s steps(1) infinite;
  }
  .ut:not(.fokus) .markor::after { background: transparent; outline: 1px solid #7bdcb5; animation: none; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .markor::after { animation: none; } }
  /* Det riktiga inmatningsfaltet: osynligt men fokuserbart, sa mobilens tangentbord kommer fram.
     Det ligger inne i terminalen och ar fullt brett: utanfor skarmen och 1px brett kunde mobilens
     markor fastna forst i faltet, sa att 12 blev 21. 16px hindrar iOS fran att zooma in. */
  .input {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 1px; padding: 0; border: 0;
    font-size: 16px; opacity: 0; pointer-events: none;
  }

  .rad { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 0; }
  .knapp {
    font: inherit; font-size: .9rem; cursor: pointer; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--gron); color: var(--gron); background: #fff;
  }
  .knapp:hover { background: var(--persika); }
  .knapp:focus-visible { outline: 2px solid var(--gron2); outline-offset: 2px; }
  .kalla { font-size: .9rem; color: #555; margin-left: auto; }
  .kalla a, .om a { color: var(--gron); }
  .om { font-size: .95rem; line-height: 1.5; margin: 10px 0 0; color: #333; }

  /* ── Effekter: en gron fosforskarm som terminalerna i Fallout 4 ── */
  .term {
    --fos: #3dff8f; --fos-svag: #1fae5c; --fos-glod: rgba(61,255,143,.55);
    background: radial-gradient(ellipse at center, #06301a 0%, #031a0d 65%, #010904 100%);
    border: 10px solid #1b1f1c; border-radius: 22px;
    box-shadow: 0 6px 24px rgba(1,73,50,.25), inset 0 0 40px rgba(0,0,0,.85), inset 0 0 6px rgba(61,255,143,.25);
  }
  .topp {
    background: transparent; color: var(--fos); border-bottom: 2px solid var(--fos-svag);
    font: 18px/1.2 "VT323", var(--mono); letter-spacing: .5px; text-transform: uppercase;
    text-shadow: 0 0 6px var(--fos-glod); padding: 10px 16px 6px;
  }
  .topp i { display: none; }
  .topp em { margin-left: 0; }
  .ut, .ut .eko, .ut .info, .ut .err, .markor { color: var(--fos); }
  .ut {
    font: 19px/1.25 "VT323", var(--mono); padding: 12px 16px;
    text-shadow: 0 0 2px var(--fos), 0 0 9px var(--fos-glod), 0 0 22px rgba(61,255,143,.18);
    scrollbar-color: var(--fos-svag) transparent;
  }
  .ut .info { color: var(--fos-svag); font-style: normal; }
  /* Skarmen kan bara visa en farg, sa fel far en ljus bakgrund i stallet for rod text. */
  .ut .err { background: rgba(61,255,143,.12); }
  .markor::after { background: var(--fos); box-shadow: 0 0 8px var(--fos-glod); }
  .ut:not(.fokus) .markor::after { background: transparent; outline-color: var(--fos); }
  .ut ::selection { background: var(--fos); color: #031a0d; text-shadow: none; }
  /* Scanlines, vinjett och ett svagt flimmer over hela skarmen. */
  .term::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; border-radius: 12px;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    animation: flimmer 5s steps(1) infinite;
  }
  @keyframes flimmer { 0%, 100% { opacity: 1; } 47% { opacity: .82; } 48% { opacity: 1; } 83% { opacity: .9; } }
  /* Ett ljusband som sakta sveper nedat over skarmen. */
  .term::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 90px; pointer-events: none; z-index: 2;
    background: linear-gradient(to bottom, rgba(61,255,143,0), rgba(61,255,143,.07), rgba(61,255,143,0));
    animation: svep 7s linear infinite;
  }
  @keyframes svep { from { transform: translateY(-90px); } to { transform: translateY(640px); } }
  /* Skarmen slas pa nar ett program startar: en ljus linje som vecklas ut. */
  .term.tand .ut, .term.tand .topp { animation: tand .3s ease-out; }
  @keyframes tand {
    0%, 30% { transform: scale(1, .004); filter: brightness(4); }
    100% { transform: none; filter: none; }
  }
  /* Enter: raden som skickas lyser upp, och en ljusvag gar genom ramen. */
  .ut .skickad { animation: skickad .45s ease-out; }
  @keyframes skickad {
    from { background: rgba(61,255,143,.35); text-shadow: 0 0 10px var(--fos), 0 0 24px var(--fos); }
    to { background: transparent; }
  }
  .term.puls { animation: puls .4s ease-out; }
  @keyframes puls {
    from { box-shadow: 0 6px 24px rgba(1,73,50,.25), inset 0 0 40px rgba(0,0,0,.85), 0 0 0 0 rgba(61,255,143,.8); }
    to { box-shadow: 0 6px 24px rgba(1,73,50,.25), inset 0 0 40px rgba(0,0,0,.85), 0 0 0 14px rgba(61,255,143,0); }
  }
  /* Menyrader man kan trycka pa. Som i Fallout lyser raden upp med inverterade farger. */
  .menyval {
    font: inherit; color: inherit; text-shadow: inherit; background: none; border: 0; margin: 0;
    padding: 0 4px; margin-left: -4px; text-align: left; cursor: pointer; border-radius: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .menyval.vald:not(:disabled), .menyval:not(:disabled):active {
    background: var(--fos); color: #031a0d; text-shadow: none; outline: none;
  }
  .menyval:disabled { cursor: text; }
  /* Terminalen fyller hela ramen: huvudmenyn ligger fast overst och svaren skrivs under den.
     Hojden satts av anpassa() i skriptet, sa att allt pa sidan ryms pa en skarm. */
  .term { display: flex; flex-direction: column; height: var(--termhojd, 560px); }
  .topp { flex: none; }
  .meny {
    flex: none; white-space: pre-wrap; padding: 12px 16px 10px; color: var(--fos);
    font: 27px/1.2 "VT323", var(--mono); border-bottom: 2px dashed var(--fos-svag);
    text-shadow: 0 0 2px var(--fos), 0 0 9px var(--fos-glod), 0 0 22px rgba(61,255,143,.18);
  }
  .meny:empty { display: none; }
  .meny .menyval:disabled { opacity: .55; }
  .ut { flex: 1 1 auto; height: auto; min-height: 0; font-size: 24px; }
  /* Gnistor nar programmet skriver att nagot lyckades. */
  .gnistor { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  .knapp[aria-pressed="false"] { opacity: .7; }
  @media (prefers-reduced-motion: reduce) {
    .term::after, .ut .skickad, .term.puls, .term.tand .ut, .term.tand .topp { animation: none; }
    .term::before, .gnistor { display: none; }
  }

  @media (max-width: 560px) {
    body { padding: 4px 12px 12px; }
    .val { grid-template-columns: 1fr; gap: 8px; }
    .ut { font-size: 19px; padding: 10px 12px; }
    .meny { font-size: 21px; padding: 10px 12px 8px; }
    .term { border-width: 6px; border-radius: 16px; }
    .topp { font-size: 15px; }
    .kalla { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="intro">Två konsolprogram från Java-kursen. Koden hämtas från GitHub och körs som
    riktiga Java-program på servern. Välj ett program, skriv ett menyval och tryck Enter,
    precis som i terminalen, eller tryck direkt på raden i menyn.</p>

  <div class="val" role="group" aria-label="Välj program">
    <button type="button" class="kort" data-prog="bibliotek" aria-pressed="false">
      <b>Bibliotekshanteraren</b><span>Labb 1 — böcker, medlemmar och lån</span>
    </button>
    <button type="button" class="kort" data-prog="budget" aria-pressed="false">
      <b>Budgethanteraren</b><span>Labb 2 — inkomster, utgifter och saldo</span>
    </button>
  </div>

  <div class="term">
    <div class="topp" aria-hidden="true"><i></i><i></i><i></i><em id="titel"></em></div>
    <div class="meny" id="meny" role="group" aria-label="Meny"></div>
    <div class="ut" id="ut" role="log" aria-live="polite"></div>
    <canvas class="gnistor" id="gnistor" aria-hidden="true"></canvas>
    <input class="input" id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           enterkeyhint="send" aria-label="Skriv i terminalen och tryck Enter">
  </div>

  <div class="rad">
    <button type="button" class="knapp" id="omstart">Starta om</button>
    <button type="button" class="knapp" id="ljud" aria-pressed="true">Ljud: på</button>
    <span class="kalla" id="kalla"></span>
  </div>
  <p class="om" id="om"></p>
</div>

<script src="splash.js" defer></script>
<script>
(function () {
  'use strict';

  var OM = {
    bibliotek: 'Egna arrayer som dubblas när de blir fulla, bubble sort på titel och max fem lån per medlem. ' +
      'Programmet sparar ingenting, så biblioteket börjar tomt varje körning. Prova: 1 lägger till en bok, 2 en medlem, 3 lånar.',
    budget: 'Generiskt Repository, streams, Optional och egna undantag. Varje körning får en egen kopia av ' +
      'repots transaktioner.csv. Röda rader är loggen, som i konsolen bara visar WARNING och SEVERE.'
  };
  var KOMMANDO = { bibliotek: 'java org.example.CliApp', budget: 'java CliApp' };

  var ut = document.getElementById('ut');
  var input = document.getElementById('input');
  var info = null;
  var aktuellt = null;   // { id, program, nasta, gen }
  var gen = 0;
  var valt = 'bibliotek';
  var skrivet = '';
  var markor = document.createElement('span');
  markor.className = 'markor';

  // ── Utskrift ──
  var menyEl = document.getElementById('meny');
  function lagg(text, klass) {
    // Huvudmenyn (den med "e. Avsluta") läggs fast överst, och resten skrivs under den.
    var d = klass ? null : huvudmeny(text);
    if (d) {
      if (d.fore.trim()) laggIn(d.fore + '\n');
      visaMeny(d.rader);
      var efter = d.efter.replace(/^\n+/, '');
      if (efter) laggIn(efter);
      return;
    }
    laggIn(text, klass);
  }
  function laggIn(text, klass) {
    var s = document.createElement('span');
    if (klass) s.className = klass;
    if (klass) s.textContent = text;
    else menyrader(s, text);
    ut.insertBefore(s, markor);
    ut.scrollTop = ut.scrollHeight;
  }
  // Rensar svaren under menyn, men behåller markören.
  function tomUt() {
    while (ut.firstChild && ut.firstChild !== markor) ut.removeChild(ut.firstChild);
  }

  // Menyrader som "3. Låna bok" eller "e. Avsluta" blir knappar som skickar valet, så att man
  // på mobilen kan trycka i stället för att fälla upp tangentbordet. De gäller bara tills man
  // har svarat: efter det är de vanlig text igen.
  var MENYRAD = /^(\s*)(\d+|e)\.(\s+\S.*)$/;
  function knapp(m) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'menyval';
    b.textContent = m[2] + '.' + m[3];
    b.dataset.val = m[2];
    b.tabIndex = -1;   // pilarna väljer, så Tab ska inte stanna på varje rad
    b.addEventListener('click', function () { if (!b.disabled) skicka(m[2]); });
    b.addEventListener('mouseenter', function () { if (!b.disabled) valj(b); });
    return b;
  }
  function menyrader(s, text) {
    text.split(/(\n)/).forEach(function (del) {
      var m = del.match(MENYRAD);
      if (!m) { s.appendChild(document.createTextNode(del)); return; }
      s.appendChild(document.createTextNode(m[1]));
      s.appendChild(knapp(m));
    });
  }

  // Letar upp huvudmenyn i en utskrift: menyrader i följd där en är "e.", plus rubriken och
  // =====-raden ovanför. Undermenyer utan "e." stannar i texten.
  function huvudmeny(text) {
    var rader = text.split('\n'), forsta = -1, sista = -1, harE = false;
    for (var i = 0; i < rader.length; i++) {
      var m = rader[i].match(MENYRAD);
      if (!m) { if (forsta >= 0) break; continue; }
      if (forsta < 0) forsta = i;
      sista = i;
      if (m[2] === 'e') harE = true;
    }
    if (!harE) return null;
    var start = forsta;
    if (start > 0 && /^\s*=+\s*$/.test(rader[start - 1])) {
      start--;
      if (start > 0 && rader[start - 1].trim()) start--;
    }
    return { fore: rader.slice(0, start).join('\n'), rader: rader.slice(start, sista + 1),
             efter: rader.slice(sista + 1).join('\n') };
  }
  function visaMeny(rader) {
    var indrag = Math.min.apply(null, rader.filter(function (r) { return r.trim(); })
      .map(function (r) { return r.match(/^\s*/)[0].length; }));
    menyEl.textContent = '';
    rader.forEach(function (r, i) {
      r = r.slice(indrag);
      var m = r.match(MENYRAD);
      menyEl.appendChild(m ? knapp(m) : document.createTextNode(r));
      if (i < rader.length - 1) menyEl.appendChild(document.createTextNode('\n'));
    });
    valj(null);
  }
  function slackMenyer() {
    term.querySelectorAll('.menyval:not(:disabled)').forEach(function (b) { b.disabled = true; });
    valj(null);
  }

  // Pil upp och ned flyttar mellan menyvalen som i Fallout, och Enter skickar det valda.
  var vald = null;
  function valj(b) {
    if (vald) vald.classList.remove('vald');
    vald = b;
    if (!b) return;
    b.classList.add('vald');
    if (!ut.contains(b)) return;
    // Scrolla bara terminalen, inte WordPress-sidan runt ramen.
    var r = b.getBoundingClientRect(), u = ut.getBoundingClientRect();
    if (r.top < u.top) ut.scrollTop -= u.top - r.top + 8;
    else if (r.bottom > u.bottom) ut.scrollTop += r.bottom - u.bottom + 8;
  }
  function flytta(steg) {
    var val = [].slice.call(term.querySelectorAll('.menyval:not(:disabled)'));
    if (!val.length) return false;
    var i = val.indexOf(vald);
    i = i < 0 ? (steg > 0 ? 0 : val.length - 1) : (i + steg + val.length) % val.length;
    valj(val[i]);
    ton(520, 0, .03, .025);
    return true;
  }

  // ── Effekter ──
  var term = document.querySelector('.term');
  var duk = document.getElementById('gnistor');
  var lugn = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Raderna som betyder att något lyckades, i båda labbarna.
  var LYCKAT = /har lagts till|registrerad\.|lånas ut tom|är återlämnad|Transaktionen har skapats|sparades till fil/;
  var svans = '';   // slutet av utskriften, eftersom en rad kan komma i flera bitar

  // Ljud: tangentklick, ett pip på Enter och två toner när något lyckas. Skapas först vid
  // första tangenttrycket, eftersom webbläsaren bara tillåter ljud efter en användarhandling.
  var ljudPa = true;
  try { ljudPa = localStorage.getItem('jl_ljud') !== 'av'; } catch (e) {}
  var ljudKnapp = document.getElementById('ljud');
  function visaLjud() {
    ljudKnapp.textContent = 'Ljud: ' + (ljudPa ? 'på' : 'av');
    ljudKnapp.setAttribute('aria-pressed', String(ljudPa));
  }
  visaLjud();
  ljudKnapp.addEventListener('click', function () {
    ljudPa = !ljudPa;
    try { localStorage.setItem('jl_ljud', ljudPa ? 'pa' : 'av'); } catch (e) {}
    visaLjud();
    fokus();
  });
  var ac = null;
  function ljudet() {
    if (!ljudPa) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ac) ac = new AC();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function klick() {
    var a = ljudet(); if (!a) return;
    var n = Math.floor(a.sampleRate * .03), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
    var src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 1400; f.Q.value = 1.2;
    g.gain.value = .35;
    src.connect(f).connect(g).connect(a.destination);
    src.start();
  }
  function ton(frekvens, start, langd, styrka) {
    var a = ljudet(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
    o.type = 'square'; o.frequency.value = frekvens;
    g.gain.setValueAtTime(styrka, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + langd);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + langd);
  }

  function tand() {
    term.classList.remove('tand');
    void term.offsetWidth;
    term.classList.add('tand');
  }

  function pulsa() {
    term.classList.remove('puls');
    void term.offsetWidth;   // starta om animationen
    term.classList.add('puls');
  }

  function kollaLyckat(text) {
    svans = (svans + text).slice(-200);
    if (!LYCKAT.test(svans)) return;
    svans = '';
    gnistor();
    ton(660, 0, .09, .05);
    ton(990, .1, .16, .05);
  }

  var partiklar = [], ritar = false;
  function gnistor() {
    if (lugn) return;
    var r = term.getBoundingClientRect(), m = markor.getBoundingClientRect();
    var x = Math.min(Math.max(m.left - r.left, 40), r.width - 40), y = Math.min(m.top - r.top, r.height - 20);
    var farger = ['#3dff8f', '#9dffc4', '#1fae5c', '#d8ffe8'];
    for (var i = 0; i < 70; i++) {
      var v = Math.random() * Math.PI * 2, f = 1.5 + Math.random() * 4.5;
      partiklar.push({ x: x, y: y, vx: Math.cos(v) * f, vy: Math.sin(v) * f - 2.5, liv: 1,
        avtag: .012 + Math.random() * .02, storlek: 1 + Math.random() * 2.2, farg: farger[i % farger.length] });
    }
    if (!ritar) { ritar = true; requestAnimationFrame(rita); }
  }
  function rita() {
    var dpr = window.devicePixelRatio || 1, b = term.clientWidth, h = term.clientHeight;
    if (duk.width !== b * dpr || duk.height !== h * dpr) { duk.width = b * dpr; duk.height = h * dpr; }
    var c = duk.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, b, h);
    c.globalCompositeOperation = 'lighter';
    partiklar = partiklar.filter(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .985; p.liv -= p.avtag;
      if (p.liv <= 0) return false;
      c.globalAlpha = p.liv;
      c.fillStyle = p.farg;
      c.shadowColor = p.farg; c.shadowBlur = 8;
      c.beginPath(); c.arc(p.x, p.y, p.storlek, 0, Math.PI * 2); c.fill();
      return true;
    });
    if (partiklar.length) requestAnimationFrame(rita);
    else { c.clearRect(0, 0, b, h); ritar = false; }
  }

  function visaMarkor() {
    markor.textContent = skrivet;
    if (!markor.parentNode) ut.appendChild(markor);
    ut.scrollTop = ut.scrollHeight;
  }

  // ── Inmatning ──
  function fokus() {
    if (window.getSelection && String(window.getSelection()) !== '') return; // låt markering vara
    input.focus({ preventScroll: true });
  }
  // Terminalen ska alltid ta emot det man skriver, utan att man först klickar i den.
  // Klick var som helst på sidan (utom på länkar och knappar) ger fokus tillbaka.
  document.addEventListener('click', function (e) {
    if (e.target.closest('a, button')) return;
    fokus();
  });
  // Ett tangenttryck när något annat har fokus flyttas till terminalen innan tecknet skrivs.
  document.addEventListener('keydown', function (e) {
    if (e.target === input || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace') {
      if (e.key === ' ' && e.target.closest('button')) return;   // mellanslag trycker på knappen
      if (e.key === 'Enter' && e.target.closest('a, button')) return;
      fokus();
    }
  });
  input.addEventListener('focus', function () { ut.classList.add('fokus'); markorSist(); });
  input.addEventListener('blur', function () {
    ut.classList.remove('fokus');
    // Med mus och tangentbord tas fokus tillbaka direkt. På mobilen skulle det fälla upp
    // tangentbordet hela tiden, så där räcker det med att trycka i terminalen.
    if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
      setTimeout(function () {
        if (document.hasFocus() && (document.activeElement === document.body || !document.activeElement)) fokus();
      }, 0);
    }
  });
  window.addEventListener('focus', function () { if (!document.activeElement || document.activeElement === document.body) fokus(); });
  // Terminalen skriver alltid sist på raden, så markören hålls i slutet av fältet.
  function markorSist() { var n = input.value.length; try { input.setSelectionRange(n, n); } catch (e) {} }
  input.addEventListener('input', function () { markorSist(); skrivet = input.value; visaMarkor(); klick(); valj(null); });
  input.addEventListener('keydown', function (e) {
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && input.value === '') {
      if (flytta(e.key === 'ArrowDown' ? 1 : -1)) e.preventDefault();
      return;
    }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (vald && input.value === '') { skicka(vald.textContent.split('.')[0]); return; }
    skicka(input.value);
  });

  // Skickar en rad till programmet, från Enter eller från en menyrad man tryckt på.
  function skicka(rad) {
    input.value = '';
    skrivet = '';
    markor.textContent = '';
    if (!aktuellt) return;
    if (aktuellt.klar) { starta(aktuellt.program); return; }
    // Ett svar på huvudmenyn börjar en ny sida: det gamla under menyn töms, och valet skrivs
    // överst med sin text, till exempel "> 3. Låna bok".
    var menyknapp = [].slice.call(menyEl.querySelectorAll('.menyval:not(:disabled)'))
      .filter(function (b) { return b.dataset.val === rad.trim(); })[0];
    var huvudmenyAktiv = !!menyEl.querySelector('.menyval:not(:disabled)');
    slackMenyer();
    if (huvudmenyAktiv) {
      tomUt();
      lagg('> ' + (menyknapp ? menyknapp.textContent : rad) + '\n', 'eko skickad');
    } else {
      lagg(rad + '\n', 'eko skickad');
    }
    pulsa();
    ton(880, 0, .07, .04);
    fetch('api/k/' + aktuellt.id + '/in', { method: 'POST', body: rad }).catch(function () {});
  }

  // ── Körningar ──
  function stoppa() {
    if (aktuellt && !aktuellt.klar) {
      fetch('api/k/' + aktuellt.id + '/stopp', { method: 'POST', keepalive: true }).catch(function () {});
    }
  }

  function starta(program) {
    stoppa();
    var minGen = ++gen;
    valt = program;
    aktuellt = null;
    ut.textContent = '';
    menyEl.textContent = '';
    svans = '';
    valj(null);
    tand();
    skrivet = ''; input.value = '';
    visaMarkor();
    document.querySelectorAll('.kort').forEach(function (k) {
      k.setAttribute('aria-pressed', String(k.getAttribute('data-prog') === program));
    });
    document.getElementById('titel').textContent = (program === 'bibliotek' ? 'Bibliotekshanteraren' : 'Budgethanteraren') +
      ' — ' + KOMMANDO[program];
    document.getElementById('om').textContent = OM[program];
    visaKalla(program);
    anpassa();
    lagg('$ ' + KOMMANDO[program] + '\n', 'info');

    fetch('api/start?program=' + program, { method: 'POST' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (s) {
        if (minGen !== gen) return;
        if (!s.ok) { lagg((s.j.fel || 'Kunde inte starta programmet') + '\n', 'err'); signaleraRedo(); return; }
        aktuellt = { id: s.j.id, program: program, nasta: 0, klar: false };
        hamta(aktuellt, minGen);
      })
      .catch(function () {
        if (minGen === gen) lagg('Kunde inte nå Java-tjänsten. Försök igen om en stund.\n', 'err');
        signaleraRedo();
      });
  }

  // Splashen släpper på DATAN, inte på sin egen speltid: den väntar på att programmet skrivit
  // sin första rad. Ett fel är också ett slut på väntan, så båda vägarna signalerar.
  function signaleraRedo() {
    if (window.LABBAR_REDO) return;
    window.LABBAR_REDO = true;
    window.dispatchEvent(new Event('labbar-redo'));
  }

  function hamta(k, minGen) {
    fetch('api/k/' + k.id + '/ut?fran=' + k.nasta)
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (s) {
        if (minGen !== gen) return;
        if (!s.ok) { lagg('\n' + (s.j.fel || 'Körningen avbröts') + '\n', 'err'); k.klar = true; signaleraRedo(); return; }
        s.j.bitar.forEach(function (b) { lagg(b.t, b.e ? 'err' : ''); if (!b.e) kollaLyckat(b.t); });
        if (s.j.bitar.length) signaleraRedo();
        k.nasta = s.j.nasta;
        if (s.j.klar) {
          k.klar = true;
          lagg('\nProcess finished with exit code ' + s.j.kod + '\n', 'info');
          lagg('Tryck Enter för att köra igen ', 'info');
          return;
        }
        hamta(k, minGen);
      })
      .catch(function () {
        if (minGen !== gen) return;
        setTimeout(function () { if (minGen === gen) hamta(k, minGen); }, 2000);
      });
  }

  function visaKalla(program) {
    var el = document.getElementById('kalla');
    el.textContent = '';
    if (!info || !info[program]) return;
    var p = info[program];
    var a = document.createElement('a');
    a.href = p.repo + '/tree/' + p.commit; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'GitHub @ ' + p.commit;
    el.append('Byggt från ', a, ' · Java ' + String(info.java).split(/[+-]/)[0]);
    anpassa();
  }

  document.querySelectorAll('.kort').forEach(function (k) {
    k.addEventListener('click', function () { starta(k.getAttribute('data-prog')); fokus(); });
  });
  document.getElementById('omstart').addEventListener('click', function () {
    starta(valt);
    fokus();
  });
  window.addEventListener('pagehide', stoppa);

  fetch('api/info').then(function (r) { return r.json(); }).then(function (j) {
    info = j;
    window.LABBAR_INFO = j;
    window.dispatchEvent(new Event('labbar-info'));
    visaKalla(valt);
  }).catch(function () {});

  // Terminalen ska fylla skärmen. I WordPress berättar sidan runt ramen hur högt besökarens
  // fönster är (jlFonster), och vi svarar med hur hög ramen behöver vara (jlHojd), se
  // wordpress-embed.html. Utan det tar terminalen den höjd som blir över i ramen.
  var fonster = 0;
  var WP = /^https:\/\/(www\.)?elitrobban\.se$/;
  window.addEventListener('message', function (e) {
    if (!WP.test(e.origin) || !e.data || typeof e.data.jlFonster !== 'number') return;
    fonster = e.data.jlFonster;
    anpassa();
  });
  function anpassa() {
    var h;
    if (fonster) h = fonster - 24;
    else h = window.innerHeight - (document.body.offsetHeight - term.offsetHeight);
    document.documentElement.style.setProperty('--termhojd', Math.max(h, 420) + 'px');
    if (fonster && window.parent !== window) {
      window.parent.postMessage({ jlHojd: document.body.offsetHeight }, '*');
    }
  }
  window.addEventListener('resize', anpassa);
  window.addEventListener('labbar-info', anpassa);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(anpassa);

  starta('bibliotek');
  anpassa();
  // Med tangentbord kan man skriva direkt när sidan har laddats. På mobilen väntar vi på ett tryck,
  // så att tangentbordet inte fälls upp av sig självt.
  if (window.matchMedia && window.matchMedia('(hover: hover)').matches) fokus();
})();
</script>
